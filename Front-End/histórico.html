<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico</title>
    <link rel="stylesheet" href="Style/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <nav>
        <h3> AMATRAVEL </h3>
        <a href="Cadastro.html"> Pessoas </a>
        <a href="registro.html"> Registro </a>
        <a href="histórico.html" class="ativo"> Histórico</a>
        <a href="relatório.html"> Relatório </a>
    </nav>

    <!-- CABEÇALHO -->
    <div class="page_header">
        <div class="page_title">
            <h1> Histórico de Viagens </h1>
            <div class="subtitle">
                <h3> Consulte registros e controle os pagamentos por passageiro </h3>
            </div>
        </div>
    </div>

    <!-- BARRA DE FILTROS -->
    <div class="filtros_container">

        <div class="filtro_grupo">
            <label for="filtro_data_inicio">De</label>
            <!-- // VARIAVEL: filtro_data_inicio -->
            <input type="date" id="filtro_data_inicio">
        </div>

        <div class="filtro_grupo">
            <label for="filtro_data_fim">Até</label>
            <!-- // VARIAVEL: filtro_data_fim -->
            <input type="date" id="filtro_data_fim">
        </div>

        <div class="filtro_grupo">
            <label for="filtro_pessoa">Passageiro</label>
            <!-- // VARIAVEL: filtro_pessoa -->
            <!-- Popular com fetch("/pessoas") igual no registro.html -->
            <select id="filtro_pessoa">
                <option value="">Todos</option>
            </select>
        </div>

        <div class="filtro_grupo">
            <label>Trecho</label>
            <div class="filtro_trechos">
                <label class="custom_checkbox">
                    <!-- // VARIAVEL: filtro_ida -->
                    <input type="checkbox" id="filtro_ida" value="ida" checked>
                    <span class="checkmark">Ida</span>
                </label>
                <label class="custom_checkbox">
                    <!-- // VARIAVEL: filtro_volta -->
                    <input type="checkbox" id="filtro_volta" value="volta" checked>
                    <span class="checkmark">Volta</span>
                </label>
            </div>
        </div>

        <!-- // funcao_buscar_historico -->
        <button class="btn_buscar" id="btn_buscar" onclick="buscarHistorico()">🔍 Buscar</button>
    </div>

    <!-- ÁREA DE RESULTADOS — populada dinamicamente pelo JS -->
    <div id="Conteudo_Historico"></div>


    <!-- BARRA DE AÇÃO EM LOTE -->
    <!-- // O JS mostra essa barra quando algum checkbox .historico_check está marcado -->
    <!-- // CONTAINER: barra_lote -->
    <div id="barra_lote" class="barra_lote" style="display: none;">
        <span id="lote_contagem" class="lote_contagem">0 selecionados</span>
        <!-- // funcao_confirmar_lote → abre modal confirmando a ação em lote -->
        <button class="btn_lote btn_lote_pago" onclick="confirmarLote(1)">✅ Marcar como Pago</button>
        <button class="btn_lote btn_lote_pendente" onclick="confirmarLote(0)">⏳ Marcar como Pendente</button>
    </div>

    <!-- MODAL DE CONFIRMAÇÃO DE PAGAMENTO -->
    <!-- // VARIAVEL: modal_confirmacao -->
    <div id="modal_confirmacao" class="modal_overlay" style="display: none;">
        <div class="modal">
            <div class="modal_header">
                <h2>Confirmar Alteração</h2>
                <!-- // funcao_fechar_confirmacao -->
                <button class="btn_fechar" onclick="fecharConfirmacao()">✕</button>
            </div>
            <!-- // O JS altera esse texto conforme a ação (pago/pendente, individual/lote) -->
            <p id="confirmacao_texto" class="confirmacao_texto">Deseja alterar o status de pagamento?</p>
            <div class="modal_buttons">
                <button class="btn_cancelar" onclick="fecharConfirmacao()">Cancelar</button>
                <!-- // funcao_executar_alteracao → executa o PUT/PATCH no banco -->
                <button class="btn_salvar" id="btn_confirmar_acao" onclick="executarAlteracao()">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- MENSAGEM DE LISTA VAZIA -->
    <!-- // O JS controla display none/flex -->
    <div id="historico_vazio" class="historico_vazio" style="display: none;">
        <p>Nenhum registro encontrado para os filtros selecionados.</p>
    </div>

    <script>
        // 2. buscarHistorico() → lê os filtros, faz fetch, chama criarLinhaHistorico()
        async function buscarHistorico() {
            const DataInicio = document.getElementById('filtro_data_inicio').value;
            const DataFim = document.getElementById('filtro_data_fim').value;
            const Pessoa_id = document.getElementById('filtro_pessoa').value;
            const Ida = document.getElementById('filtro_ida').checked ? 1 : 0;
            const Volta = document.getElementById('filtro_volta').checked ? 1 : 0;

            // monta a URL com os filtros selecionados como parâmetros de query
            // ex: /historico?pessoa_id=3&data_inicio=2026-04-01
            let url = new URL('/historico', window.location.origin);

            if (DataInicio) url.searchParams.append('data_inicio', DataInicio);
            if (DataFim)    url.searchParams.append('data_fim', DataFim);
            if (Pessoa_id)  url.searchParams.append('pessoa_id', Pessoa_id);
            if (Ida)        url.searchParams.append('ida', Ida);
            if (Volta)      url.searchParams.append('volta', Volta);

            try {
                const resposta = await fetch(url);
                const dados = await resposta.json();

                const container = document.getElementById('Conteudo_Historico');
                container.innerHTML = ''; // limpa os cards anteriores antes de desenhar os novos

                // mostra ou esconde a mensagem de lista vazia
                if (dados.length === 0) {
                    document.getElementById('historico_vazio').style.display = 'flex';
                } else {
                    document.getElementById('historico_vazio').style.display = 'none';
                }

                // para cada resultado, cria um card e adiciona na tela
                dados.forEach(viagem => {
                    const card = criarLinhaHistorico(viagem);
                    container.appendChild(card);
                });

            } catch (erro) {
                console.error("Erro ao buscar histórico: ", erro);
            }
        }

        // 3. criarLinhaHistorico(viagem) → monta o HTML de cada linha do histórico
        function criarLinhaHistorico(viagem) {
            // formata a data de YYYY-MM-DD para DD/MM/YYYY
            const dataFormatada = new Date(viagem.data_viagem).toLocaleDateString('pt-BR', { timeZone: 'UTC' });

            // monta os badges de valor conforme os trechos da viagem
            let badges = '';
            if (viagem.ida)   badges += `<span class="badge badge-ida">Ida: R$ ${parseFloat(viagem.valor_ida).toFixed(2)}</span>`;
            if (viagem.volta) badges += `<span class="badge badge-volta">Volta: R$ ${parseFloat(viagem.valor_volta).toFixed(2)}</span>`;

            // define o texto e classe do botão conforme status de pagamento
            const btnTexto  = viagem.pago ? '✅ Pago'      : '⏳ Pendente';
            const btnClasse = viagem.pago ? 'btn_pago'     : 'btn_pendente';
            const novoStatus = viagem.pago ? 0 : 1; // inverso do atual (para alternar ao clicar)

            // cria o elemento div da linha
            const div = document.createElement('div');
            div.className = 'historico_linha';
            div.innerHTML = `
                <input type="checkbox" class="historico_check" value="${viagem.id_viagem_passageiro}">
                <div class="historico_info">
                    <h3 class="historico_nome">${viagem.nome_passageiro}</h3>
                    <div class="historico_badges">${badges}</div>
                </div>
                <div class="historico_data">
                    <span class="historico_data_texto">📅 ${dataFormatada}</span>
                </div>
                <div class="historico_pagamento">
                    <button class="btn_status ${btnClasse}"
                        onclick="confirmarPagamento(${viagem.id_viagem_passageiro}, ${novoStatus})">
                        ${btnTexto}
                    </button>
                </div>
            `;

            // quando o checkbox mudar, atualiza a barra de lote
            div.querySelector('.historico_check').addEventListener('change', atualizarBarraLote);
            return div;
        }

        // --- Estado interno: guarda o que será alterado ao confirmar no modal ---
        let _pendente_ids    = [];  // ids que serão alterados
        let _pendente_status = null; // novo valor de pago (0 ou 1)

        // 4. confirmarPagamento(id_vp, novo_status) → abre modal para 1 registro
        function confirmarPagamento(id_vp, novo_status) {
            _pendente_ids    = [id_vp];
            _pendente_status = novo_status;

            const texto = novo_status === 1
                ? 'Deseja marcar este registro como Pago?'
                : 'Deseja marcar este registro como Pendente?';

            document.getElementById('confirmacao_texto').textContent = texto;
            document.getElementById('modal_confirmacao').style.display = 'flex';
        }

        // 5. confirmarLote(novo_status) → abre modal para todos os selecionados
        function confirmarLote(novo_status) {
            const checks = document.querySelectorAll('.historico_check:checked');
            _pendente_ids    = Array.from(checks).map(cb => cb.value);
            _pendente_status = novo_status;

            const acao  = novo_status === 1 ? 'Pago' : 'Pendente';
            const texto = `Deseja marcar ${_pendente_ids.length} registro(s) como ${acao}?`;

            document.getElementById('confirmacao_texto').textContent = texto;
            document.getElementById('modal_confirmacao').style.display = 'flex';
        }

        // 6. executarAlteracao() → faz o PUT no servidor para cada id pendente
        async function executarAlteracao() {
            try {
                // faz um PUT para cada id selecionado
                const promessas = _pendente_ids.map(id =>
                    fetch(`/historico/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ pago: _pendente_status })
                    })
                );
                await Promise.all(promessas); // espera todos os PUTs terminarem

                fecharConfirmacao();
                buscarHistorico(); // recarrega a lista com os dados atualizados
            } catch (erro) {
                console.error('Erro ao alterar status:', erro);
            }
        }

        // 7. fecharConfirmacao() → fecha o modal e limpa o estado interno
        function fecharConfirmacao() {
            document.getElementById('modal_confirmacao').style.display = 'none';
            _pendente_ids    = [];
            _pendente_status = null;
        }

        // 8. atualizarBarraLote() → mostra/esconde a barra de ações em lote
        function atualizarBarraLote() {
            const checks   = document.querySelectorAll('.historico_check:checked');
            const barra    = document.getElementById('barra_lote');
            const contagem = document.getElementById('lote_contagem');

            if (checks.length > 0) {
                barra.style.display = 'flex';
                contagem.textContent = `${checks.length} selecionado(s)`;
            } else {
                barra.style.display = 'none';
            }
        }

        // chama carregarFiltros assim que a página terminar de carregar
        document.addEventListener("DOMContentLoaded", carregarFiltros);
    </script>
</body>

</html>
